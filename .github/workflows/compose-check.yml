name: Check Docker Compose

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check Compose configuration
        run: docker compose config

      - name: Start website
        run: docker compose up -d

      - name: Check website response
        run: |
          curl --fail --show-error --silent \
            --retry 10 --retry-connrefused --retry-delay 2 \
            http://localhost:8089 -o response.html

          echo "Website response:"
          cat response.html
          echo

          if ! grep -Fq "Production website" response.html; then
            echo "ERROR: Expected text 'Production website' was not found"
            exit 1
          fi


      - name: Stop containers
        if: always()
        run: docker compose down
